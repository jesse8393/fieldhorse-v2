<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2" />
    <!-- Pinch-zoom re-enabled (WCAG 1.4.4). user-scalable=no was here to
         stop iOS auto-zoom on input focus, but the real fix (global 16px
         input font-size in global.css) removed the trigger, and iOS 10+
         ignores user-scalable=no anyway, so it only hurt Android users. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EDE8DF" />
    <!-- Apply the theme before the first paint (spec section 10). Mirrors
         resolveTheme in src/lib/themeMode.ts: the mode lives in
         fh:theme-mode (auto, day or night; auto when unset), and Auto
         reads the daylight windows ThemeContext caches in fh:sun, or 7 am
         to 7 pm when there are none. themeMode.test.ts runs this script
         against resolveTheme. The CSP in netlify.toml allows it by its
         sha256 hash: update that hash whenever this script changes. -->
    <script>
      try {
        var m = localStorage.getItem('fh:theme-mode'), t = 'light', n = Date.now(), d, i, h
        if (m === 'night') t = 'dark'
        else if (m !== 'day') {
          try { d = JSON.parse(localStorage.getItem('fh:sun') || '{}').days } catch (e) {}
          if (d && d.length && n >= d[0][0] && n < d[d.length - 1][1]) {
            t = 'dark'
            for (i = 0; i < d.length; i++) if (n >= d[i][0] && n < d[i][1]) t = 'light'
          } else {
            h = new Date().getHours()
            t = h >= 7 && h < 19 ? 'light' : 'dark'
          }
        }
        document.documentElement.setAttribute('data-theme', t)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#171611' : '#EDE8DF')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fieldhorse" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />

    <!-- SEO + social link previews. Fieldhorse is auth-gated so crawlers
         only ever see the login screen; these meta tags make sure that
         when someone shares fieldhorse.io they get a proper card preview
         instead of a bare URL. -->
    <meta name="description" content="Field operations for contractors. Run jobs, schedule crews, send proposals, and collect payments, all on your phone." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fieldhorse" />
    <meta property="og:title" content="Fieldhorse" />
    <meta property="og:description" content="Field operations for contractors. Run jobs, schedule crews, send proposals, and collect payments, all on your phone." />
    <meta property="og:image" content="https://fieldhorse.io/icon-512.png" />
    <meta property="og:url" content="https://fieldhorse.io" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fieldhorse" />
    <meta name="twitter:description" content="Field operations for contractors. Run jobs, schedule crews, send proposals, and collect payments, all on your phone." />
    <meta name="twitter:image" content="https://fieldhorse.io/icon-512.png" />
    <!-- Supabase project origin: open TCP+TLS in parallel with HTML parse
         so the first auth + bootstrap query lands ~150-300ms sooner on
         cold visits. `crossorigin` matches the fetch credentials mode
         the Supabase client uses. -->
    <link rel="preconnect" href="https://pnmhblvslftdzfcdezbw.supabase.co" crossorigin />
    <title>Fieldhorse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
