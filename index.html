<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fieldhorse" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />

    <!-- SEO + social link previews. Fieldhorse is auth-gated so crawlers
         only ever see the login screen; these meta tags make sure that
         when someone shares fieldhorse.io they get a proper card preview
         instead of a bare URL. -->
    <meta name="description" content="Field operations for contractors. Run jobs, schedule crews, send proposals, collect payments — all on your phone." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fieldhorse" />
    <meta property="og:title" content="Fieldhorse" />
    <meta property="og:description" content="Field operations for contractors. Run jobs, schedule crews, send proposals, collect payments — all on your phone." />
    <meta property="og:image" content="https://fieldhorse.io/icon-512.png" />
    <meta property="og:url" content="https://fieldhorse.io" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fieldhorse" />
    <meta name="twitter:description" content="Field operations for contractors. Run jobs, schedule crews, send proposals, collect payments — all on your phone." />
    <meta name="twitter:image" content="https://fieldhorse.io/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Supabase project origin — open TCP+TLS in parallel with HTML parse
         so the first auth + bootstrap query lands ~150-300ms sooner on
         cold visits. `crossorigin` matches the fetch credentials mode
         the Supabase client uses. -->
    <link rel="preconnect" href="https://pnmhblvslftdzfcdezbw.supabase.co" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <title>Fieldhorse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
