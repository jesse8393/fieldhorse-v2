# Web, database and native source checks. Store signing/submission remains
# in the manually triggered eas-build.yml; this workflow does not deploy.
#
# Every check a contributor can run locally runs here too: lint, the two
# repo audits, typecheck, unit tests, production build, and the Playwright
# end to end suite on Playwright's bundled Chromium. The audit of
# 2026-10-09 found the e2e suite had been failing on main for weeks because
# only typecheck, test and build ran in CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a fresh push doesn't queue
# behind a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Typecheck every Supabase Edge Function
        working-directory: supabase/functions
        run: deno check --node-modules-dir=none --lock=deno.lock */index.ts
      - name: Preserve resolved Edge Function dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-dependency-lock
          path: supabase/functions/deno.lock
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install test tools
        run: npm ci
      - name: Install native dependencies
        run: npm ci --prefix mobile
      - name: Native TypeScript
        run: npm run typecheck --prefix mobile
      - name: Native data and session regressions
        run: npm run test:mobile
      - name: Export iOS and Android JavaScript bundles
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: synthetic_ci_key
          EXPO_NO_DOTENV: 1
        run: npx expo export --platform ios --platform android

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: audit_fixture_only
          POSTGRES_DB: fieldhorse_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fieldhorse_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit RLS policy expectations
        run: npm run audit:rls

      - name: Audit design system
        run: npm run audit:design

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PostgreSQL roles, billing and concurrent allocation guards
        env:
          AUDIT_DATABASE_URL: postgres://postgres:audit_fixture_only@127.0.0.1:5432/fieldhorse_audit
        run: npm run test:db

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chrome, mobile-chrome]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The config starts the Vite dev server itself with mock Supabase
      # credentials; no secrets are needed. PW_CHANNEL stays unset so the
      # bundled Chromium is used.
      # Run persistence and affected entry/UI checks first so their result
      # is visible before the longer application suite completes.
      - name: Persistence and UI regression checks
        run: npx playwright test tests/e2e/workspace-persistence.spec.ts tests/e2e/workspace-tasks.spec.ts tests/e2e/mobile-ui-ux.spec.ts tests/e2e/customer-link-edit.spec.ts tests/e2e/record-history.spec.ts tests/e2e/palette.spec.ts tests/e2e/login.spec.ts tests/e2e/public-smoke.spec.ts tests/e2e/desktop-route-audit.spec.ts --project=${{ matrix.project }}

      - name: End to end tests
        run: npx playwright test --project=${{ matrix.project }} --grep-invert='(workspace-persistence|workspace-tasks|mobile-ui-ux|customer-link-edit|record-history|palette|login|public-smoke|desktop-route-audit).spec.ts'

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: test-results/
          retention-days: 7
