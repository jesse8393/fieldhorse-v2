# Web app CI. Guards the web app (root package.json); the separate
# eas-build.yml owns the mobile/ Expo app.
#
# Every check a contributor can run locally runs here too: lint, the two
# repo audits, typecheck, unit tests, production build, and the Playwright
# end to end suite on Playwright's bundled Chromium. The audit of
# 2026-10-09 found the e2e suite had been failing on main for weeks because
# only typecheck, test and build ran in CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a fresh push doesn't queue
# behind a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: audit_fixture_only
          POSTGRES_DB: fieldhorse_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fieldhorse_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit RLS policy expectations
        run: npm run audit:rls

      - name: Audit design system
        run: npm run audit:design

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PostgreSQL roles, billing and concurrent allocation guards
        env:
          AUDIT_DATABASE_URL: postgres://postgres:audit_fixture_only@127.0.0.1:5432/fieldhorse_audit
        run: npm run test:db

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chrome, mobile-chrome]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The config starts the Vite dev server itself with mock Supabase
      # credentials; no secrets are needed. PW_CHANNEL stays unset so the
      # bundled Chromium is used.
      - name: End to end tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: test-results/
          retention-days: 7
