name: Generate cost guard migration
on:
  push:
    branches: [test/live-audit-diagnostics-20261110]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          ref: c6877c9285a13516f409506c7310f340a01e4a3c
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate local migration
        run: |
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 migration new guard_job_cost_updates
          find supabase/migrations -name '*_guard_job_cost_updates.sql' -print
