<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon — wraps the canonical PNG artwork (/icon-source.png) in a
  minimal SVG so the existing <link rel="icon" type="image/svg+xml">
  in index.html keeps resolving. The PNG itself is the source of
  truth — see scripts/build-icons.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Fieldhorse">
  <image href="/icon-source.png" x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid slice"/>
</svg>
